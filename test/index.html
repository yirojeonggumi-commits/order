<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>
/* 여는 화면을 좀 더 오래 보여주기 — 숫자만 바꾸면 길이 조절(ms) */
(function(){var e=Date.now()+900;while(Date.now()<e){}})();
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="이로정 발주">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F1E9">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>이로정 발주 (테스트)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="이로정 발주">
<meta name="application-name" content="이로정 발주">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F4F1E9">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17120F">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F4F1E9; --surface:#FDFBF6; --fill:#EBE5D8; --fill2:#F1ECE1;
  --ink:#23201D; --sub:#685D50; --mute:#9A8E7E; --line:#DFD7C7; --line2:#EBE5D9;
  --brand:#B2392C; --brand-dk:#8E2C21;
  --ok:#1F6B4A; --okbg:#E3EFE7; --okrow:#F2F7F3;
  --red:#B3261E; --redbg:#FBEDEB; --gold:#D9A23C; --star:#DCD1C4;
  --sans:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --serif:'Nanum Myeongjo',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17120F; --surface:#1E1815; --fill:#2A221D; --fill2:#221B17;
  --ink:#F2EAE2; --sub:#BCA998; --mute:#948374; --line:#33281F; --line2:#272019;
  --brand:#E8927C; --brand-dk:#CE7762;
  --ok:#5FBF8E; --okbg:#1B2B23; --okrow:#17211C;
  --red:#FF8A80; --redbg:#2A1917; --gold:#E0B35E; --star:#3E342C;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#17120F; --surface:#1E1815; --fill:#2A221D; --fill2:#221B17;
  --ink:#F2EAE2; --sub:#BCA998; --mute:#948374; --line:#33281F; --line2:#272019;
  --brand:#E8927C; --brand-dk:#CE7762;
  --ok:#5FBF8E; --okbg:#1B2B23; --okrow:#17211C;
  --red:#FF8A80; --redbg:#2A1917; --gold:#E0B35E; --star:#3E342C;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.5;letter-spacing:-.2px;
  word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%;
  font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top-in{max-width:620px;margin:0 auto;padding:18px 20px 0}
.brand{display:flex;align-items:center;gap:9px}
.seal{display:inline-flex;align-items:center;justify-content:center;
  writing-mode:vertical-rl;text-orientation:upright;
  background:var(--brand);color:#FBF1EC;font-family:var(--serif);font-weight:800;
  font-size:11px;letter-spacing:1.5px;line-height:1;width:21px;height:42px;
  border-radius:4px;flex:none;user-select:none}
.brand .mj{display:block;font-family:var(--serif);font-weight:800;font-size:15px;color:var(--brand);
  letter-spacing:2px;line-height:1}
.brand h1{margin:0;font-weight:800;font-size:26px;letter-spacing:-1.1px;line-height:1}
.brand .sub{margin-left:auto;font-size:12px;color:var(--mute);font-weight:600;padding-bottom:3px}

.vendors{display:flex;flex-wrap:wrap;column-gap:17px;row-gap:0;margin-top:15px;
  border-bottom:1px solid var(--line)}
.vendors button{padding:9px 1px 9px;font-size:15.5px;font-weight:700;color:var(--mute);
  display:flex;align-items:center;gap:5px;flex:none;white-space:nowrap;
  border-bottom:2.5px solid transparent;margin-bottom:-1px}
.vendors button[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
.tally{font-size:11px;font-weight:800;padding:1px 6px;border-radius:999px;
  background:var(--fill);color:var(--mute);line-height:1.5}
.vendors button[data-has="1"] .tally{background:var(--ok);color:#fff}

.tools{display:flex;gap:9px;align-items:center;padding:14px 0 0}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:9px;padding:11px 14px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px;font-weight:500}
.search input::placeholder{color:var(--mute)}
.search svg{flex:none;color:var(--mute)}
.iconbtn{flex:none;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;
  background:var(--surface);color:var(--brand);display:grid;place-items:center;font-size:14px;
  font-weight:800}
.iconbtn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#FFF3EA}

.chips{display:flex;gap:20px;padding:14px 0 2px}
.chips button{font-size:13.5px;font-weight:700;color:var(--mute);padding-bottom:3px;
  border-bottom:2px solid transparent;display:flex;align-items:center;gap:5px}
.chips button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--gold)}
.chips button i{font-style:normal;font-size:11.5px;font-weight:800;color:var(--ok)}

main{max-width:620px;margin:0 auto;padding:0 20px 150px}
.rule{display:flex;gap:9px;align-items:flex-start;margin:16px 0 2px;padding:12px 14px;
  background:var(--fill);border-radius:12px;font-size:12.5px;line-height:1.55;
  color:var(--sub);font-weight:500}
.rule .ic{flex:none;color:var(--brand);font-weight:800}
.rule b{color:var(--brand);font-weight:800}
.rule.warn{background:var(--redbg)}
.rule.warn .ic,.rule.warn b{color:var(--red)}

.contact{display:flex;align-items:center;gap:10px;width:100%;margin:10px 0 2px;padding:13px 15px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;text-align:left}
.contact .who{font-weight:800;font-size:15px;flex:none}
.contact .tel{font-weight:700;font-size:15.5px;color:var(--brand);letter-spacing:.2px}
.contact .cc{margin-left:auto;display:flex;gap:6px;flex:none}
.contact .act{display:grid;place-items:center;padding:7px 13px;border-radius:999px;
  font-size:13px;font-weight:800;text-decoration:none;background:var(--fill);
  color:var(--brand);border:0}
.contact .act.call{background:var(--okbg);color:var(--ok)}
.contact .act.cp{background:none;color:var(--mute);padding:7px 4px}
.contact .act:active{opacity:.6}
.deliv .lead{display:block;font-size:12.5px;font-weight:700;color:var(--mute);margin-bottom:2px}
.deliv .contact{margin:10px 0 0;background:var(--surface)}
.cat{margin-bottom:2px}
.cat>summary{display:flex;align-items:center;gap:11px;padding:22px 2px 8px;cursor:pointer;
  list-style:none}
.cat>summary::-webkit-details-marker{display:none}
.cat>summary .ttl{font-family:var(--serif);font-weight:700;font-size:14.5px;color:var(--brand);
  letter-spacing:.4px;white-space:nowrap}
.cat>summary .ln{flex:1;height:1px;background:var(--line)}
.cat>summary .n{font-size:12px;color:var(--mute);font-weight:600}
.cat>summary .badge{font-size:11.5px;font-weight:800;color:#fff;background:var(--ok);
  padding:1.5px 8px;border-radius:999px}
.caret{width:7px;height:7px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);
  transform:rotate(45deg);transition:transform .18s;flex:none;margin-bottom:3px}
.cat[open] .caret{transform:rotate(-135deg)}

.row{display:flex;align-items:center;gap:9px;padding:0 4px;border-bottom:1px solid var(--line2);
  transition:background .13s}
.row[data-on="1"]{background:var(--okrow)}
.star,.delx{flex:none;width:20px;align-self:stretch;font-size:14px;color:var(--star);line-height:1}
.star[aria-pressed="true"]{color:var(--gold)}
.delx{color:var(--red);font-size:17px;width:24px}
.pick{flex:1;min-width:0;text-align:left;padding:14px 2px;display:flex;align-items:baseline;
  gap:8px;flex-wrap:wrap}
.pick .nm{font-weight:600;font-size:16px}
.row[data-on="1"] .pick .nm{font-weight:800}
.pick .un{font-size:12px;color:var(--mute);font-weight:500}
.add{flex:none;width:36px;height:36px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--mute);font-size:19px;font-weight:600;line-height:1;
  display:grid;place-items:center}
.add:active{background:var(--fill)}
.stepper{flex:none;display:flex;align-items:center;gap:3px}
.stepper button{width:36px;height:36px;border-radius:999px;font-size:18px;font-weight:800;
  color:var(--ok);background:var(--okbg);display:grid;place-items:center}
.stepper button:active{transform:scale(.92)}
.qty{min-width:28px;text-align:center;font-weight:800;font-size:17px;color:var(--ok)}
.empty{padding:44px 16px;text-align:center;color:var(--mute);font-size:14px;line-height:1.7}

.addbox{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 6px;padding:16px;
  background:var(--fill2);border:1px solid var(--line);border-radius:14px}
.addbox .lab{flex:1 0 100%;font-family:var(--serif);font-size:14.5px;font-weight:800;color:var(--brand)}
.addbox input{flex:1;min-width:110px;padding:12px 14px;background:var(--surface);
  border:1px solid var(--line);border-radius:11px;outline:none;font-size:15px}
.addbox input:focus{border-color:var(--brand)}
.addbox .unit{flex:0 0 78px;min-width:0}
.addbox button{flex:none;padding:12px 18px;border-radius:11px;background:var(--brand);
  color:#FFF3EA;font-weight:700;font-size:14px}
.addbox .hint{flex:1 0 100%;font-size:12.5px;color:var(--sub);line-height:1.6;font-weight:500}
.addbox .hint b{color:var(--red);font-weight:800}
.addbox .undel{flex:1 0 100%;padding:12px;border-radius:11px;background:var(--surface);
  color:var(--sub);font-weight:700;font-size:13.5px;border:1px solid var(--line)}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--bg);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bar-in{max-width:620px;margin:0 auto;padding:11px 20px 14px;display:flex;flex-direction:column;gap:9px}
.bar-top{display:flex;align-items:center;gap:10px;min-height:20px}
.count{flex:1;min-width:0;font-size:12.5px;color:var(--mute);font-weight:600}
.count b{font-size:15px;color:var(--ink);font-weight:800}
.ghost{flex:none;padding:3px 2px;font-size:13px;font-weight:700;color:var(--mute);
  border-bottom:1px solid var(--line)}
.go{width:100%;padding:16px;border-radius:13px;background:var(--brand);color:#FFF3EA;
  font-weight:800;font-size:16.5px;letter-spacing:-.4px}
.go:active{background:var(--brand-dk)}
.go[disabled]{background:var(--fill);color:var(--mute);cursor:default}

.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-top{display:flex;align-items:center;gap:10px;padding:18px 20px 10px}
.sheet-top h2{margin:0;font-weight:800;font-size:19px;letter-spacing:-.6px}
.sheet-top h2 .mj{font-family:var(--serif);font-weight:800;color:var(--brand);margin-right:4px}
.sheet-top .x{margin-left:auto;width:36px;height:36px;border-radius:999px;font-size:21px;
  color:var(--sub);display:grid;place-items:center;background:var(--fill)}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-in{max-width:620px;margin:0 auto;padding:4px 20px 28px;display:flex;flex-direction:column;gap:13px}
.destbox{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:12px 14px;
  background:var(--fill);border-radius:12px}
.destbox .lab{font-size:12.5px;font-weight:700;color:var(--sub);margin-right:3px}
.destbox button{padding:9px 16px;border-radius:999px;background:var(--surface);
  border:1px solid var(--line);font-size:14.5px;font-weight:700;color:var(--sub)}
.destbox button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);
  color:#FFF3EA}
.destbox .need{flex:1 0 100%;font-size:12.5px;font-weight:700;color:var(--red)}
.destbox .one{padding:9px 16px;border-radius:999px;background:var(--brand);color:#FFF3EA;
  font-size:14.5px;font-weight:700}
.fields{display:flex;gap:9px;flex-wrap:wrap}
.field{flex:1;min-width:130px;display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--mute)}
.field input{padding:12px 14px;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;outline:none;font-size:15px;font-weight:500}
.field input:focus{border-color:var(--brand)}
.deliv{padding:13px 15px;background:var(--fill);border-radius:12px;font-size:14px;
  color:var(--sub);font-weight:500;line-height:1.55}
.deliv b{color:var(--brand);font-weight:800}
.deliv.warn{background:var(--redbg);color:var(--red)}
.deliv.warn b{color:var(--red)}
.slip{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:inset 0 4px 0 var(--brand)}
.slip-head{padding:16px 16px 0;display:flex;align-items:center;gap:7px}
.slip-head .mk{width:19px;height:19px;border-radius:6px;flex:none}
.slip-head .t{font-family:var(--serif);font-weight:800;font-size:14.5px;color:var(--brand);
  letter-spacing:-.3px}
.slip-head .hint{margin-left:auto;font-size:11.5px;color:var(--mute);font-weight:500}
.slip pre{margin:12px 0 0;padding:14px 16px 18px;font-family:inherit;font-size:14.5px;
  line-height:1.85;white-space:pre-wrap;word-break:keep-all;overflow-x:auto;
  border-top:1px dashed var(--line)}
.acts{display:flex;flex-direction:column;gap:9px}
.acts button,.acts a{display:block;width:100%;padding:15px;border-radius:13px;font-weight:800;
  font-size:15.5px;letter-spacing:-.3px;text-align:center;text-decoration:none}
.acts .primary{background:var(--brand);color:#FFF3EA}
.acts .primary:active{background:var(--brand-dk)}
.acts .second{background:var(--fill);color:var(--ink)}
.acts .done{background:var(--surface);color:var(--ok);border:1.5px solid var(--okbg)}
.toast{font-size:13.5px;color:var(--ok);font-weight:700;min-height:19px;text-align:center}
.note{font-size:12.5px;color:var(--mute);line-height:1.7;font-weight:500}

.cal-mon{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 12px 13px}
.cal-mon h3{margin:0 0 10px;font-family:var(--serif);font-weight:800;font-size:15.5px;
  text-align:center;color:var(--brand)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-grid .hd{text-align:center;font-size:11.5px;color:var(--mute);font-weight:700;padding-bottom:5px}
.cal-grid .hd.sun{color:var(--red)}
.cell{aspect-ratio:1;display:grid;place-items:center;font-size:13.5px;font-weight:600;
  border-radius:10px;color:var(--ink)}
.cell.sun{color:var(--red)}
.cell.hol{background:var(--redbg);color:var(--red);font-weight:800}
.cell.dl{box-shadow:inset 0 0 0 2px var(--brand);color:var(--brand);font-weight:800}
.cell.today{background:var(--ink);color:var(--bg);font-weight:800}
.cell.today.hol{background:var(--red);color:#fff}
.hollist{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.hollist div{font-size:13px;color:var(--sub);font-weight:500;line-height:1.5}
.hollist b{color:var(--red);font-weight:800}
.hollist i{font-style:normal;color:var(--brand);font-weight:800}
.hollist .none{color:var(--mute)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);font-weight:500}
.legend span{display:flex;align-items:center;gap:6px}
.legend em{font-style:normal;width:16px;height:16px;border-radius:6px;flex:none}

.tbadge{font-size:11px;font-weight:800;color:#FFF;background:#3E6B63;border-radius:999px;
  padding:3px 9px;margin-left:8px;letter-spacing:0;line-height:1.5;flex:none;align-self:center}
.top{box-shadow:inset 0 3px 0 #3E6B63}
</style>

<div class="top">
  <div class="top-in">
    <div class="brand">
      <span class="seal" aria-hidden="true">理老亭</span>
      <span class="mj">이로정</span>
      <h1>발주</h1><span class="tbadge">테스트</span>
      <span class="sub" id="today"></span>
    </div>
    <div class="vendors" role="tablist" aria-label="거래처">
      <button type="button" role="tab" data-v="택배" aria-selected="true"><span>택배</span><span class="tally">0</span></button>
      <button type="button" role="tab" data-v="물류" aria-selected="false"><span>물류</span><span class="tally">0</span></button>
      <button type="button" role="tab" data-v="도투향" aria-selected="false"><span>도투향</span><span class="tally">0</span></button>
      <button type="button" role="tab" data-v="한일수산" aria-selected="false"><span>한일수산</span><span class="tally">0</span></button>
      <button type="button" role="tab" data-v="사모님" aria-selected="false"><span>사모님</span><span class="tally">0</span></button>
      <button type="button" role="tab" data-v="뻥튀기" aria-selected="false"><span>뻥튀기</span><span class="tally">0</span></button>
      <button type="button" role="tab" data-v="밀양탁주" aria-selected="false"><span>밀양탁주</span><span class="tally">0</span></button>
      <button type="button" role="tab" data-v="고급강정" aria-selected="false"><span>고급강정</span><span class="tally">0</span></button>
      <button type="button" role="tab" data-v="신우유통" aria-selected="false"><span>신우유통</span><span class="tally">0</span></button>
    </div>
    <div class="tools">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        <input id="q" type="search" placeholder="품목 검색" autocomplete="off" aria-label="품목 검색">
      </div>
      <button type="button" class="iconbtn" id="f-add" aria-pressed="false"
        aria-label="품목 관리">품목</button>
    </div>
    <div class="chips" role="group" aria-label="보기">
      <button type="button" id="f-fav" aria-pressed="false">자주</button>
      <button type="button" id="f-on" aria-pressed="false">담은 것 <i id="on-n"></i></button>
      <button type="button" id="f-cal">달력</button>
    </div>
  </div>
</div>

<main id="list" aria-live="polite"></main>

<div class="bar">
  <div class="bar-in">
    <div class="bar-top">
      <div class="count" id="count"></div>
      <button type="button" class="ghost" id="clear">비우기</button>
    </div>
    <button type="button" class="go" id="make" disabled>발주서 만들기</button>
  </div>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-label="발주서">
  <div class="sheet-top">
    <h2 id="s-title">발주서</h2>
    <button type="button" class="x" id="s-close" aria-label="닫기">&times;</button>
  </div>
  <div class="sheet-body">
    <div class="sheet-in">
      <div class="destbox" id="s-dest" hidden></div>

function ymd(d){return d.toLocaleDateString('sv-SE')}
function addD(d,n){const x=new Date(d.getTime());x.setDate(x.getDate()+n);return x}
function today0(){const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())}
function md(s){const d=new Date(s+'T00:00:00');return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+DAY[d.getDay()]+')'}

function holRuns(){
  const ks=Object.keys(HOL).sort(); const runs=[]; let cur=null;
  ks.forEach(k=>{
    const d=new Date(k+'T00:00:00');
    if(cur){
      const p=new Date(cur.end+'T00:00:00');
      const gap=Math.round((d-p)/86400000);
      let join=(gap===1);
      if(gap>1&&gap<=3){ join=true;
        for(let i=1;i<gap;i++){const x=addD(p,i);
          if(x.getDay()!==0&&x.getDay()!==6){join=false;break;}}
      }
      if(join){cur.end=k;cur.names.push(HOL[k]);return;}
    }
    cur={start:k,end:k,names:[HOL[k]]}; runs.push(cur);
  });
  runs.forEach(r=>{
    r.name=r.names.find(n=>n.indexOf('대체')<0&&n.indexOf('연휴')<0)||r.names[0];
    r.dl=ymd(addD(new Date(r.start+'T00:00:00'),-2));
  });
  return runs;
}
function nextRun(){
  const t=ymd(today0());
  return holRuns().find(r=>r.end>=t)||null;
}
function parcelHtml(){
  const r=nextRun(); const t=today0(), ts=ymd(t);
  if(!r) return {warn:false,html:'공휴일 <b>2일 전</b>까지 발주해야 합니다.'};
  const span=(r.start===r.end)?md(r.start):md(r.start)+' ~ '+md(r.end);
  if(r.dl<ts)
    return {warn:true,html:'<b>'+r.name+'</b> '+span+' · 택배 발주 마감 '+md(r.dl)+'이 <b>지났습니다</b>.'};
  const n=Math.round((new Date(r.dl+'T00:00:00')-t)/86400000);
  const w=new Date(r.dl+'T00:00:00').getDay();
  return {warn:n<=1,
    html:'다음 공휴일 <b>'+r.name+'</b> '+span+' · 택배 발주는 <b>'+md(r.dl)+'</b>까지'+
      (n===0?' — <b>오늘까지입니다</b>':' (D-'+n+')')+
      ((w===0||w===6)?' · 마감이 주말이니 앞당겨 넣으십시오':'')};
}
function parcelLike(v){
  const r=parcelHtml();

  return {warn:r.warn, html:'<b>택배로 들어옵니다</b> · 택배와 같은 기준입니다 — '+r.html};
}
const WEEKWED=['택배','뻥튀기','밀양탁주','고급강정','신우유통'];
function wedHtml(){
  const t=today0(), diff=(3-t.getDay()+7)%7, w=addD(t,diff);
  const when = diff===0 ? '<b>오늘이 수요일입니다</b>'
    : '이번 주 수요일 <b>'+ymd(w)+'</b> · D-'+diff;
  return {warn:diff<=1, html:'매주 <b>수요일 전까지</b> 발주를 넣으셔야 합니다 · '+when};
}
function ruleHtml(v){
  let base=null;
  if(v==='택배'||v==='뻥튀기') base=parcelLike(v);
  else if(v==='물류') base={warn:false,html:'일·월·화·수·목·금 발주 → <b>다음날 배송</b>  (토요일 발주 제외)'};
  const wk = WEEKWED.indexOf(v)>=0 ? wedHtml() : null;
  if(base&&wk) return {warn:base.warn||wk.warn, html:base.html+'<br>'+wk.html};
  return wk||base;
}
function deliv(v,ds){
  const d=new Date(ds+'T00:00:00');
  if(v==='택배'||v==='뻥튀기') return parcelLike(v);
  if(v!=='물류') return null;
  if(isNaN(d)) return {warn:false,html:'발주일을 정하십시오.'};
  if(d.getDay()===6)
    return {warn:true,html:'<b>토요일 발주는 다음날 배송이 되지 않습니다.</b> 일요일에 다시 넣으시면 월요일에 들어옵니다.'};
  const n=addD(d,1);
  return {warn:false,html:'배송 예정 — <b>'+ymd(n)+' ('+DAY[n.getDay()]+')</b>'};
}

function drawCal(){
  const t=today0(), ts=ymd(t), runs=holRuns();
  const dls={}; runs.forEach(r=>{dls[r.dl]=r});
  let out='<div class="legend">'+
    '<span><em style="background:var(--redbg)"></em>공휴일</span>'+
    '<span><em style="box-shadow:inset 0 0 0 2px var(--brand)"></em>택배 발주 마감</span>'+
    '<span><em style="background:var(--ink)"></em>오늘</span></div>';
  for(let i=0;i<3;i++){
    const base=new Date(t.getFullYear(),t.getMonth()+i,1);
    const y=base.getFullYear(), mo=base.getMonth();
    const last=new Date(y,mo+1,0).getDate();
    out+='<div class="cal-mon"><h3>'+y+'년 '+(mo+1)+'월</h3><div class="cal-grid">';
    DAY.forEach((w,wi)=>{out+='<div class="hd'+(wi===0?' sun':'')+'">'+w+'</div>'});
    for(let b=0;b<base.getDay();b++) out+='<div></div>';
    const list=[];
    for(let dd=1;dd<=last;dd++){
      const cd=new Date(y,mo,dd), k=ymd(cd);
      const cls=['cell'];
      if(cd.getDay()===0) cls.push('sun');
      if(HOL[k]) cls.push('hol');
      if(dls[k]) cls.push('dl');
      if(k===ts) cls.push('today');
      out+='<div class="'+cls.join(' ')+'">'+dd+'</div>';
      const r=runs.find(x=>x.start===k);
      if(r) list.push('<div><b>'+md(r.start)+(r.start===r.end?'':' ~ '+md(r.end))+' '+r.name+'</b>'+
        ' — 택배 발주 <i>'+md(r.dl)+'</i>까지</div>');
    }
    out+='</div>';
    out+='<div class="hollist">'+(list.length?list.join(''):'<div class="none">이 달에는 공휴일이 없습니다.</div>')+'</div>';
    out+='</div>';
  }
  out+='<p class="note">공휴일은 2026~2027년 기준으로 넣어 두었습니다. 대체공휴일까지 반영되어 있습니다. '+
       '택배 발주 마감은 연휴 첫날에서 2일 전으로 계산합니다.</p>';
  $('#cal-body').innerHTML=out;
}

function load(){
  try{
    const r=localStorage.getItem(KEY); if(!r)return;
    const o=JSON.parse(r);
    if(typeof o.who==='string')S.who=o.who;
    if(o.dest&&typeof o.dest==='object')S.dest=o.dest;
    if(o.qty&&typeof o.qty==='object')S.qty=o.qty;
    if(o.fav_&&typeof o.fav_==='object')S.fav_=o.fav_;
    if(o.gone&&typeof o.gone==='object')S.gone=o.gone;
    if(o.extra)VEND.concat(RENAME.map(x=>x[0])).forEach(v=>{if(Array.isArray(o.extra[v]))S.extra[v]=o.extra[v]});
    RENAME.forEach(([a,bb])=>{
      const OLD=a+'\u0000', NEW=bb+'\u0000';
      [S.qty,S.fav_,S.gone].forEach(m=>{
        Object.keys(m).forEach(k=>{
          if(k.indexOf(OLD)===0){ m[NEW+k.slice(OLD.length)]=m[k]; delete m[k]; }
        });
      });
      if(o.extra&&Array.isArray(o.extra[a])&&!(S.extra[bb]||[]).length)
        S.extra[bb]=o.extra[a];
      if(S.dest&&(a in S.dest)&&!(bb in S.dest)){ S.dest[bb]=S.dest[a]; delete S.dest[a]; }
    });
    [['염소','도투향'],['튀김용미꾸라지','한일수산']]
      .concat([["고급강정", "고급강정"], ["밀양사과막걸리", "밀양탁주"], ["밀양아리랑막걸리", "밀양탁주"], ["깐생강", "사모님"], ["굵은고춧가루", "사모님"], ["베트남고춧가루", "사모님"], ["청양고춧가루", "사모님"], ["들깨가루", "사모님"], ["제피", "사모님"], ["매실진액", "사모님"], ["들기름", "사모님"], ["참기름", "사모님"]])
      .forEach(([n,nv])=>{

      [S.qty,S.fav_,S.gone].forEach(m=>{ if(from in m){ m[to]=m[from]; delete m[from]; } });

  return hello+when+'\n\n'+body+'\n감사합니다 ^^';

$('#make').addEventListener('click',()=>{
  if(!$('#s-date').value)$('#s-date').value=new Date().toLocaleDateString('sv-SE');
  $('#s-who').value=S.who;
  drawSlip();$('#sheet').hidden=false;document.body.style.overflow='hidden';
});
function kakaoHref(){ return /Android/i.test(navigator.userAgent||'') ? 'intent://launch#Intent;scheme=kakaotalk;package=com.kakao.talk;end' : 'kakaotalk://'; }
function copyNow(t){
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t); return true; } }catch(e){}
  try{ const ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.cssText='position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,t.length); const ok=document.execCommand('copy'); document.body.removeChild(ta); return ok; }catch(e){}
  return false;
}
$('#s-kakao').addEventListener('click',e=>{
  const v=S.vendor, t=slipText(v);
  copyNow(t);
  sent={v:v,t:t};
  setTimeout(()=>{ picked(v).forEach(r=>setQty(v,r[0],0)); if(S.on&&!picked(v).length)S.on=false; save(); render(); },800);
});
$('#s-close').addEventListener('click',()=>{$('#sheet').hidden=true;document.body.style.overflow=''});
$('#s-date').addEventListener('change',drawSlip);
$('#s-who').addEventListener('input',e=>{S.who=e.target.value;save();drawSlip()});
$('#s-copy').addEventListener('click',async()=>{
  const v=S.vendor;
  if(sent&&sent.v===v&&!picked(v).length){
    await copy(sent.t,'복사했습니다. 카톡에 붙여넣으십시오.'); return;
  }
  const t=slipText(v);
  const ok=await copy(t,'복사했습니다 · 담은 목록을 비웠습니다.');
  if(!ok)return;
  sent={v:v,t:t};
  picked(v).forEach(r=>setQty(v,r[0],0));
  if(S.on&&!picked(v).length)S.on=false;
  save(); drawSlip(); render();
});

document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(!$('#sheet').hidden){$('#sheet').hidden=true;document.body.style.overflow=''}
  else if(!$('#cal').hidden){$('#cal').hidden=true;document.body.style.overflow=''}
});

load();
$('#s-date').value=new Date().toLocaleDateString('sv-SE');
render();



if('serviceWorker' in navigator){ addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
</body>
</html>
