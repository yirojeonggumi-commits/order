<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>카톡 열기 테스트</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;font:16px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f6f6f4;color:#1a1a1a}
h1{font-size:19px;margin:0 0 4px}
p.sub{margin:0 0 16px;color:#666;font-size:14px}
.box{background:#fff;border:1px solid #e3e3df;border-radius:12px;padding:14px;margin-bottom:12px}
.box b{display:block;font-size:14px;margin-bottom:8px}
a.btn,button.btn{display:block;width:100%;text-align:center;padding:14px;border-radius:10px;
 background:#1a1a1a;color:#fff;text-decoration:none;font-size:16px;font-weight:600;border:0;margin-top:8px}
.info{font-size:13px;color:#444;white-space:pre-wrap;word-break:break-all;background:#fff;
 border:1px solid #e3e3df;border-radius:12px;padding:12px;margin-bottom:16px}
.r{font-size:13px;color:#b24;margin-top:6px}
</style></head><body>
<h1>카톡 열기 테스트</h1>
<p class="sub">1번부터 차례로 눌러보시고, 카톡이 열린 번호를 알려주십시오.</p>
<div class="info" id="info">…</div>

<div class="box"><b>1. 공유창 (navigator.share)</b>
<button class="btn" id="b1">1번 — 공유창 띄우기</button><div class="r" id="r1"></div></div>

<div class="box"><b>2. kakaotalk:// 링크</b>
<a class="btn" href="kakaotalk://">2번 — kakaotalk://</a></div>

<div class="box"><b>3. kakaoopen:// 링크</b>
<a class="btn" href="kakaoopen://">3번 — kakaoopen://</a></div>

<div class="box"><b>4. intent + 스킴</b>
<a class="btn" href="intent://launch#Intent;scheme=kakaotalk;package=com.kakao.talk;end">4번 — intent 스킴</a></div>

<div class="box"><b>5. intent 런처 실행</b>
<a class="btn" href="intent:#Intent;package=com.kakao.talk;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;end">5번 — intent 런처</a></div>

<div class="box"><b>6. 카카오톡 보내기(kakaolink)</b>
<a class="btn" href="intent://send#Intent;scheme=kakaolink;package=com.kakao.talk;end">6번 — kakaolink</a></div>

<script>
(function(){
  var std = (window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  document.getElementById('info').textContent =
    '공유기능(share): ' + (navigator.share ? '있음' : '없음') +
    '\n홈화면앱 모드: ' + (std ? '예 (홈화면 아이콘으로 실행중)' : '아니오 (브라우저)') +
    '\n주소: ' + location.protocol +
    '\n브라우저: ' + navigator.userAgent;
  document.getElementById('b1').addEventListener('click', function(){
    var r=document.getElementById('r1');
    if(!navigator.share){ r.textContent='이 브라우저에는 공유기능이 없습니다'; return; }
    try{
      navigator.share({text:'테스트 문구입니다'}).then(function(){ r.textContent='공유 성공'; })
       .catch(function(e){ r.textContent='공유 취소/실패: '+(e&&e.name||e); });
    }catch(e){ r.textContent='오류: '+e; }
  });
})();
</script></body></html>
